",ogTitle:"Businesses for Sale in Canada — 150+ Verified Listings | businessbuy.site"},"/uk":{title:"Businesses for Sale in UK — 300+ Verified Listings | businessbuy.site",description:"300+ businesses for sale in UK — London to Manchester. Agencies, e-commerce, pubs & B2B services. Leasehold & freehold on businessbuy.site.",ogTitle:"Businesses for Sale in UK — 300+ Verified Listings | businessbuy.site"},"/australia":{title:"Businesses for Sale in Australia — 200+ Verified Listings | businessbuy.site",description:"200+ businesses for sale in Australia — Sydney, Melbourne, Brisbane. High-margin lifestyle, trades & online businesses ready for new owners on businessbuy.site.",ogTitle:"Businesses for Sale in Australia — 200+ Verified Listings | businessbuy.site"},"/privacy":{title:"Privacy Policy | businessbuy.site",description:"Privacy Policy for businessbuy.site — how we handle your email, affiliate links, and data. Contact agents@getservices.ai.",ogTitle:"Privacy Policy | businessbuy.site"},"/terms":{title:"Terms of Service | businessbuy.site",description:"Terms of Service for businessbuy.site — independent affiliate, not a broker. Informational content only, not financial advice.",ogTitle:"Terms of Service | businessbuy.site"},"/affiliate-disclosure":{title:"Affiliate Disclosure | businessbuy.site",description:"Affiliate disclosure for businessbuy.site — independent affiliate of World Businesses for Sale via Awin ID 116725. Commission at no extra cost.",ogTitle:"Affiliate Disclosure | businessbuy.site"},"/contact":{title:"Contact Us | businessbuy.site",description:"Contact businessbuy.site — agents@getservices.ai, +1 (313) 729-1534. Upton, MA. Private briefing for acquisition entrepreneurs.",ogTitle:"Contact Us | businessbuy.site"}},Gc=[{q:"Where can I find businesses for sale in USA, Canada, UK and Australia?",a:"businessbuy.site curates live businesses for sale across 4 markets from World Businesses for Sale — the largest affiliate marketplace for established businesses. USA is the largest market with 400+ active listings including SBA-ready deals, followed by Canada (150+ across Ontario, BC, Alberta), UK (300+ from London to Manchester), and Australia (200+ across Sydney, Melbourne, Brisbane). Use our country pages to filter by industry, price, and revenue. Every listing shows verified financials, reason for sale, and direct broker contact — no scraped data, just real businesses for sale ready for new owners."},{q:"How much does it cost to buy a small business in 2026?",a:"In 2026, small businesses for sale range from $10k for micro e-commerce stores to $10M+ for profitable multi-location operations. On businessbuy.site, most first-time buyers acquire main-street businesses for $75k-$500k — service businesses, agencies, trades, and online stores. You rarely pay all cash: 60% of our members use SBA 7(a) loans, seller financing, or earn-outs to bridge the gap. A $250k business might be $25k down with SBA loan, seller note, and working capital. Browse our USA, Canada, UK and Australia listings to see real asking prices with SDE and EBITDA disclosed."},{q:"How do you value a business before making an offer?",a:"How to value a business comes down to three methods we teach on businessbuy.site. 1) SDE multiple: Seller's Discretionary Earnings x 2-4x for main-street businesses under $2M — the most common for buy a business deals. 2) EBITDA multiple: 3-6x for larger, management-run companies. 3) Asset valuation: inventory + equipment + goodwill. Where sellers pad numbers in the CIM: add-backs that aren't truly discretionary, inflated growth projections, and undisclosed owner perks. Our valuation guide shows you how to normalize financials, check customer concentration, and anchor your offer at fair market value before you buy a business."},{q:"Can I buy a business with no money down or SBA loan for business acquisition?",a:"Yes — you can buy a business with little to no money down using SBA loan business acquisition strategies. The most common stack is: 10% buyer injection, 80% SBA 7(a) loan (up to $5M in USA, similar programs in Canada/UK/Australia), and 10% seller financing as standby. Seller financing means the owner finances part of the price and gets paid over 2-5 years, which aligns incentives. Earn-outs let you pay extra only if revenue targets are met. On businessbuy.site, we flag SBA-eligible listings and seller-financed deals in USA, Canada, UK and Australia — ideal if you want to buy a business without using all your own cash."},{q:"What is the best business to buy for a first-time buyer?",a:"The best business to buy for first-time buyers has recurring revenue, low owner dependence, and documented systems — exactly what we curate on businessbuy.site. Top categories: profitable service businesses (HVAC, cleaning, landscaping), B2B agencies with retainers, SaaS micro-businesses with MRR, and e-commerce stores with 3+ year history. Avoid businesses where the owner is the brand, or customer concentration >30%. Look for 15%+ SDE margin, staff in place, and supplier contracts. Our USA, Canada, UK and Australia listings filter for owner-operated vs. management-run so you can buy a business that fits your skills and lifestyle goals."},{q:"What due diligence should I do before buying a business in USA, Canada, UK or Australia?",a:"Due diligence checklist before you buy a business: 1) Financials — 3 years tax returns, P&L, SDE recast, and proof of add-backs. 2) Customers — top 10 customers revenue concentration and contract status. 3) Lease & assets — remaining lease term, transferability, and equipment condition. 4) Team — key employee retention, owner involvement hours. 5) Legal — liens, litigation, licenses in USA, Canada, UK or Australia jurisdiction. 6) Suppliers & growth — dependency risks. On businessbuy.site, we give members a 7-day diligence sprint template that mirrors what SBA lenders and UK/Australia brokers require, so you can buy a business with confidence across all 4 markets."},{q:"How long does it take to buy a business?",a:"Average time to buy a business is 90 days from first look to close — data from our private members on businessbuy.site. Timeline: Week 1-2 search and NDA, Week 3-4 valuation and LOI, Week 5-8 due diligence and SBA loan business acquisition underwriting (or bank finance in Canada, UK, Australia), Week 9-12 purchase agreement and close. SBA loans add 30-45 days. UK and Australia leasehold transfers can be faster (60 days), while US asset deals with inventory counts take longer. Subscribe to our Deal Sheet newsletter — every Friday we break down one real timeline so you know how to buy a business without delays."},{q:"Are businesses for sale on businessbuy.site verified?",a:"businessbuy.site does not broker businesses — we curate and link to verified businesses for sale on World Businesses for Sale, a marketplace with licensed brokers in USA, Canada, UK and Australia. Each listing shows broker-verified financials, owner reason for sale, and direct contact. We are an independent affiliate (Awin ID 116725, AffID 3075433) — some country links are sponsored and we may earn commission at no extra cost to you. This keeps our valuations independent. Always conduct your own due diligence. We flag businesses for sale USA, Canada, UK, Australia categories separately so you browse real, live deals, not stale listings."},{q:"Do I need a broker to buy a business in UK or Australia?",a:"You don't legally need a broker to buy a business in UK or Australia, but most UK businesses for sale and Australia listings are broker-listed. Brokers charge 5-12% on leasehold deals and often £1,500-£5k upfront fees. Going in prepared with valuation comps, proof of funds, and SBA-style finance knowledge saves you £1,500 typical in broker fees — our members report faster responses when they cite SDE multiples and financing plan. On businessbuy.site, we teach you how to evaluate UK businesses for sale and Australia businesses without overpaying, whether you go direct or via broker. Browse our UK and Australia pages via affiliate links to contact brokers directly."},{q:"How do I get started buying a business on businessbuy.site?",a:"Start here on businessbuy.site: 1) Browse businesses for sale USA, Canada, UK, Australia via our 4 country pages — click through to World Businesses for Sale to view live listings, financials and broker contacts. 2) Subscribe to The Deal Sheet newsletter — one vetted listing worth your time every Friday, with valuation teardown and financing math. 3) Read our 3 private playbook guides: how to value a business, how to finance with SBA loan business acquisition or seller financing, and due diligence checklist. 4) When ready, submit NDA, request CIM, and make a data-driven offer. Our mission: help you buy a business in 2026 faster than building one, across USA, Canada, UK and Australia."}];function Zc({variant:e="dark",size:n=38}){let t=e==="dark";return v("div",{className:`logo-kit logo-${e}`,style:{display:"inline-flex",alignItems:"center",gap:12},"aria-label":"businessbuy.site logo",children:[s("div",{style:{width:n,height:n,borderRadius:12,flexShrink:0,background:t?"linear-gradient(135deg, #F1E4C7 0%, #D4AF37 52%, #B8941F 100%)":"linear-gradient(135deg, #F1E4C7 0%, #D4AF37 52%, #B8941F 100%)",boxShadow:t?"0 2px 16px rgba(212,175,55,0.45), inset 0 1px 0 rgba(255,255,255,0.7), 0 0 0 1px rgba(212,175,55,0.35) inset":"0 2px 12px rgba(212,175,55,0.35), inset 0 1px 0 rgba(255,255,255,0.7)",border:"1px solid rgba(255,255,255,0.18)",display:"flex",alignItems:"center",justifyContent:"center",position:"relative",overflow:"hidden"},children:v("svg",{width:n*0.72,height:n*0.72,viewBox:"0 0 32 32","aria-hidden":"true",children:[s("defs",{children:v("linearGradient",{id:`lg-${e}`,x1:"0%",y1:"0%",x2:"100%",y2:"100%",children:[s("stop",{offset:"0%",stopColor:"#FFF6DD"}),s("stop",{offset:"52%",stopColor:"#D4AF37"}),s("stop",{offset:"100%",stopColor:"#8B6914"})]})}),s("text",{x:"16",y:"11",textAnchor:         @import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,SOFT,WONK@9..144,50..100,0..1,600;9..144,50..100,0..1,700&family=Space+Grotesk:wght@300;400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap');
        :root{
          --ink: #0F0A1E;
          --ink-deep: #0A0614;
          --ink-2: #1A1330;
          --bg: #FFFBF2;
          --gold: #D4AF37;
          --gold-2: #B8941F;
          --gold-deep: #8B6914;
          --champagne: #F1E4C7;
          --champagne-mid: #E8DCC0;
          --champagne-dim: rgba(241,228,199,0.68);
          --line-gold: rgba(212,175,55,0.22);
          --line-gold-strong: rgba(212,175,55,0.38);
          --radius-xl: 26px;
          --radius-lg: 22px;
        }
        *{box-sizing:border-box;}
        html{scroll-behavior:smooth;}
        body{
          margin:0;
          background: var(--bg);
          color: var(--ink);
          font-family:'IBM Plex Sans', -apple-system, sans-serif;
          line-height:1.55;
          -webkit-font-smoothing: antialiased;
          overflow-x:hidden;
        }
        h1,h2,h3{font-family:'Fraunces', Georgia, serif; font-weight:700; margin:0; letter-spacing:-0.03em; line-height:0.96;}
        .serif{font-family:'Fraunces', Georgia, serif;}
        .serif-num{font-family:'Fraunces', Georgia, serif; font-variant-numeric:oldstyle-nums; font-feature-settings:"onum" 1;}
        a{color:inherit; text-decoration:none;}
        a:focus-visible, button:focus-visible, input:focus-visible{
          outline:1.5px solid var(--gold);
          outline-offset:3px;
        }
        .wrap{max-width:1180px; margin:0 auto; padding:0 28px; position:relative; z-index:1;}

        /* PRO HEADER */
        .site-header{
          position:sticky;
          top:0;
          z-index:90;
          background: rgba(15,10,30,0.92);
          backdrop-filter: blur(18px) saturate(1.15);
          -webkit-backdrop-filter: blur(18px) saturate(1.15);
          border-bottom:1px solid var(--gold);
          box-shadow: 0 1px 0 rgba(212,175,55,0.18), 0 12px 40px -18px rgba(0,0,0,0.55);
        }
        .site-header::before{
          content:"";
          position:absolute; inset:0;
          background:
            radial-gradient(600px 280px at 12% 0%, rgba(212,175,55,0.10), transparent 60%),
            radial-gradient(500px 280px at 88% 0%, rgba(76,29,149,0.28), transparent 60%);
          pointer-events:none;
        }
        .header-inner{
          display:flex; align-items:center; justify-content:space-between; gap:18px;
          padding:14px 0;
          position:relative; z-index:1;
        }
        .header-left{display:flex; align-items:center; gap:14px; min-width:0;}
        .header-center{
          display:flex; align-items:center; gap:6px; flex-wrap:wrap;
          justify-content:center;
        }
        .header-center a{
          font-family:'Space Grotesk', sans-serif;
          font-size:0.80rem; font-weight:600; letter-spacing:0.02em;
          color: var(--champagne);
          padding:8px 14px; border-radius:999px;
          border:1px solid transparent;
          transition: all .20s ease;
        }
        .header-center a:hover{
          background: rgba(212,175,55,0.12);
          border-color: rgba(212,175,55,0.28);
          color: var(--gold);
        }
        .header-center a.active-gold{
          border-color: rgba(212,175,55,0.32);
          background: rgba(212,175,55,0.08);
        }
        .header-right{display:flex; align-items:center; gap:12px;}
        .hamburger{
          display:none;
          width:40px; height:40px; border-radius:999px;
          border:1px solid rgba(212,175,55,0.30);
          background: rgba(255,255,255,0.04);
          color: var(--champagne);
          align-items:center; justify-content:center;
          cursor:pointer;
        }
        .mobile-panel{
          display:none;
          position:absolute; top:100%; left:0; right:0;
          background: rgba(10,6,20,0.98);
          backdrop-filter: blur(18px);
          border-top:1px solid rgba(212,175,55,0.18);
          border-bottom:1px solid rgba(212,175,55,0.22);
          padding:18px 28px 20px;
        }
        .mobile-panel.open{display:block;}
        .mobile-panel a{
          display:flex; padding:12px 0;
          border-bottom:1px solid rgba(212,175,55,0.10);
          color: var(--champagne);
          font-family:'Space Grotesk', sans-serif; font-weight:600; font-size:0.92rem;
        }
        .mobile-panel a:last-child{border-bottom:none;}
        .mobile-cta{margin-top:14px;}

        /* Hero */
        .hero-bleed{
          background: var(--ink);
          position:relative;
          overflow:hidden;
          border-bottom:1px solid rgba(212,175,55,0.22);
        }
        .hero-bleed::before{
          content:"";
          position:absolute; inset:0;
          background:
            radial-gradient(900px 600px at 18% 12%, rgba(212,175,55,0.16), transparent 60%),
            radial-gradient(700px 500px at 88% 20%, rgba(76,29,149,0.42), transparent 65%),
            radial-gradient(600px 400px at 50% 110%, rgba(212,175,55,0.08), transparent 60%);
          pointer-events:none;
        }
        .hero{
          padding:78px 0 68px;
          display:grid; grid-template-columns:1.25fr 0.9fr; gap:56px; align-items:end;
          position:relative; z-index:1;
        }
        .eyebrow{
          display:inline-flex; align-items:center; gap:9px;
          font-family:'Space Grotesk', sans-serif;
          font-size:0.68rem; font-weight:700; letter-spacing:0.13em; text-transform:uppercase;
          color: var(--gold);
          background: rgba(212,175,55,0.08);
          border:1px solid rgba(212,175,55,0.28);
          padding:7px 14px; border-radius:999px;
          margin-bottom:22px;
        }
        .hero h1{
          font-size:clamp(2.7rem, 5.1vw, 4.15rem);
          line-height:0.92;
          letter-spacing:-0.045em;
          color:#FFFBF2;
          max-width:14.5ch;
          text-wrap:balance;
        }
        .hero h1 em{
          font-style:normal;
          background: linear-gradient(90deg, #F1E4C7 0%, #D4AF37 60%, #B8941F 100%);
          -webkit-background-clip:text;
          background-clip:text;
          color:transparent;
          font-weight:700;
        }
        .hero p.lede{
          margin-top:24px;
          font-size:1.06rem;
          color: var(--champagne-dim);
          max-width:44ch;
          line-height:1.65;
        }
        .cta-row{margin-top:34px; display:flex; gap:14px; flex-wrap:wrap; align-items:center;}
        .btn{
          display:inline-flex; align-items:center; justify-content:center; gap:8px;
          padding:14px 28px; border-radius:999px;
          font-family:'Space Grotesk', sans-serif;
          font-size:0.90rem; font-weight:700; letter-spacing:0.01em;
          border:1.5px solid transparent;
          transition:transform .18s ease, box-shadow .18s ease, background .18s ease, color .18s ease, border-color .18s ease;
          cursor:pointer; white-space:nowrap;
        }
        .btn-primary{
          background: linear-gradient(135deg, #F1E4C7 0%, #D4AF37 55%, #C6A22E 100%);
          color: var(--ink);
          box-shadow:
            0 0 0 1px rgba(212,175,55,0.5) inset,
            0 12px 32px -12px rgba(212,175,55,0.7),
            0 2px 0 rgba(255,255,255,0.5) inset;
        }
        .btn-primary:hover{transform:translateY(-2px); box-shadow:0 16px 36px -12px rgba(212,175,55,0.8), 0 0 0 1px rgba(212,175,55,0.6) inset;}
        .btn-ghost{
          color: var(--champagne);
          border-color: rgba(241,228,199,0.28);
          background: rgba(255,255,255,0.03);
        }
        .btn-ghost:hover{border-color: var(--gold); color: var(--gold); transform:translateY(-1px);}
        .trust{display:flex; align-items:center; gap:10px; flex-wrap:wrap; padding:28px 0 0;}
        .trust .badge{
          display:inline-flex; align-items:center; gap:7px;
          font-family:'Space Grotesk', sans-serif;
          font-size:0.73rem; font-weight:600;
          color: var(--champagne);
          background: rgba(255,255,255,0.04);
          border:1px solid rgba(212,175,55,0.20);
          padding:7px 14px; border-radius:999px;
        }
        .trust .badge .g{color: var(--gold);}
        .hero-figure{
          background: linear-gradient(180deg, rgba(255,255,255,0.07) 0%, rgba(255,255,255,0.02) 100%);
          border:1px solid rgba(212,175,55,0.26);
          border-radius: var(--radius-xl);
          padding:28px 28px 22px;
          box-shadow:0 30px 70px -22px rgba(0,0,0,0.65), 0 0 0 1px rgba(212,175,55,0.12) inset;
          position:relative; overflow:hidden;
          backdrop-filter: blur(14px);
        }
        .figure-label{
          font-family:'Space Grotesk', sans-serif;
          font-size:0.62rem; letter-spacing:0.16em; text-transform:uppercase;
          color: var(--gold);
          display:flex; align-items:center; gap:8px;
          margin-bottom:18px;
        }
        .figure-label::after{content:""; flex:1; height:1px; background: linear-gradient(90deg, rgba(212,175,55,0.35), transparent);}
        .stat{display:flex; gap:14px; align-items:flex-start; padding:16px 0; border-top:1px solid rgba(212,175,55,0.13);}
        .stat:first-of-type{border-top:none; padding-top:0;}
        .stat .dot{width:9px; height:9px; border-radius:50%; background: var(--gold); box-shadow:0 0 0 4px rgba(212,175,55,0.14); margin-top:9px; flex-shrink:0;}
        .stat .n{font-family:'Fraunces', serif; font-size:1.75rem; font-weight:700; letter-spacing:-0.02em; color:#FFFBF2; line-height:1;}
        .stat .l{margin-top:5px; font-size:0.82rem; color: var(--champagne-dim); line-height:1.45; max-width:26ch;}

        /* Sections */
        .section-wrap{position:relative; overflow:hidden;}
        .watermark{
          position:absolute;
          font-family:'Fraunces', serif;
          font-weight:700;
          font-size:clamp(8rem, 18vw, 15rem);
          line-height:0.8;
          letter-spacing:-0.06em;
          color: rgba(15,10,30,0.035);
          top:8px; left:0; right:0;
          pointer-events:none; user-select:none;
          max-width:100vw; overflow:hidden; white-space:nowrap;
          transform: none;
          clip-path: inset(0);
        }
        .section-wrap.dark .watermark{color: rgba(212,175,55,0.06);}
        .section-head{display:flex; justify-content:space-between; align-items:flex-end; flex-wrap:wrap; gap:12px; padding-bottom:18px; margin-bottom:30px; border-bottom:1px solid var(--line-gold); position:relative;}
        .section-head h2{font-size:clamp(1.7rem, 3.2vw, 2.35rem);}
        .light .section-head h2{color: var(--ink);}
        .dark .section-head h2{color:#FFFBF2;}

        section{padding:72px 0;}

        .listing-note{font-size:0.81rem; color: var(--gold-deep); background: linear-gradient(180deg, #FFFBF2, #FBF0D8); border:1px dashed var(--gold-2); padding:12px 18px; border-radius:14px; margin-bottom:20px; display:flex; align-items:center; gap:10px;}

        .listing .name{font-family:'Space Grotesk', sans-serif; font-weight:700; font-size:0.98rem; letter-spacing:-0.01em; color: var(--ink);}

        .listing .go{font-family:'Space Grotesk', sans-serif; font-size:0.82rem; font-weight:700; background: var(--ink); color:#FFFBF2; padding:10px 18px; border-radius:999px; border:1px solid rgba(212,175,55,0.32); transition: all .2s ease; white-space:nowrap;}
        .listing .go:hover{background: var(--gold); color: var(--ink); border-color: var(--gold);}
        .country-badge{display:inline-flex; align-items:center; gap:6px; font-family:'Space Grotesk', sans-serif; font-size:0.68rem; font-weight:700; letter-spacing:0.08em; text-transform:uppercase; color: var(--gold-deep); background: linear-gradient(180deg, #FFFBF2, #FBF0D8); border:1px solid rgba(212,175,55,0.32); padding:5px 10px; border-radius:999px; margin-left:8px; vertical-align:middle;}
        .listing-meta{display:flex; align-items:center; flex-wrap:wrap; gap:6px; margin-bottom:2px;}
        .country-stats{display:grid; grid-template-columns:repeat(4,1fr); gap:14px; margin-top:26px;}
        .country-stat{background: var(--ink); border:1px solid rgba(212,175,55,0.22); border-top:2px solid var(--gold); border-radius:18px; padding:18px 16px; display:flex; flex-direction:column; gap:4px; box-shadow:0 18px 40px -22px rgba(0,0,0,0.55); position:relative; overflow:hidden;}
        .country-stat::before{content:""; position:absolute; inset:0; background: radial-gradient(300px 150px at 20% 0%, rgba(212,175,55,0.10), transparent 60%); pointer-events:none;}
        .country-stat .cs-flag{font-size:1.15rem; position:relative; z-index:1;}
        .country-stat .cs-num{font-family:'Fraunces', serif; font-weight:700; font-size:1.35rem; color:#FFFBF2; letter-spacing:-0.02em; position:relative; z-index:1;}
        .country-stat .cs-label{font-family:'Space Grotesk', sans-serif; font-size:0.71rem; font-weight:600; letter-spacing:0.08em; text-transform:uppercase; color: var(--champagne-dim); position:relative; z-index:1;}
        .country-stat .cs-sub{font-size:0.78rem; color: rgba(241,228,199,0.55); margin-top:2px; position:relative; z-index:1; line-height:1.4;}

        .guides{display:grid; grid-template-columns:repeat(3,1fr); gap:18px;}
        .guide{background: linear-gradient(180deg, rgba(255,255,255,0.06), rgba(255,255,255,0.02)); border:1px solid rgba(212,175,55,0.18); border-top:2px solid var(--gold); border-radius: var(--radius-lg); padding:30px 26px 28px; box-shadow:0 20px 50px -24px rgba(0,0,0,0.6), inset 0 1px 0 rgba(255,255,255,0.06); transition: transform .22s ease; position:relative; overflow:hidden;}
        .guide:hover{transform: translateY(-4px); border-color: rgba(212,175,55,0.32);}
        .guide .kicker{font-family:'Space Grotesk', sans-serif; font-size:0.66rem; font-weight:700; letter-spacing:0.14em; text-transform:uppercase; color: var(--gold);}
        .guide h3{font-size:1.28rem; line-height:1.15; margin-top:14px; color:#FFFBF2; max-width:18ch;}
        .guide p{font-size:0.9rem; color: var(--champagne-dim); margin-top:14px; line-height:1.6;}
        .guide .hair{margin-top:20px; height:1px; background: linear-gradient(90deg, rgba(212,175,55,0.28), transparent);}

        .why{display:grid; grid-template-columns:1fr 1fr; gap:20px;}
        .why-col{padding:32px 28px; border-radius: var(--radius-xl); position:relative; overflow:hidden; box-shadow:0 18px 40px -22px rgba(15,10,30,0.22); border:1px solid rgba(212,175,55,0.24);}
        .why-col::before{content:""; position:absolute; inset:0; border-radius:inherit; box-shadow: inset 0 0 0 1px rgba(212,175,55,0.10), inset 0 1px 0 rgba(255,255,255,0.6); pointer-events:none;}
        .why-col.no{background: radial-gradient(400px 200px at 20% 0%, rgba(120,20,50,0.10), transparent 60%), linear-gradient(180deg, #22131C 0%, #1B1219 100%);}
        .why-col.yes{background: radial-gradient(400px 200px at 20% 0%, rgba(20,90,60,0.14), transparent 60%), linear-gradient(180deg, #121C19 0%, #0F1A17 100%);}
        .why-col h3{font-size:1.22rem; display:flex; align-items:center; gap:10px; margin-bottom:16px;}
        .why-col.no h3{color:#FFD6DE;}
        .why-col.yes h3{color:#CFF6E8;}
        .why-col .icon{width:28px; height:28px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:0.85rem; border:1px solid rgba(212,175,55,0.35); background: rgba(212,175,55,0.12); color: var(--gold);}
        .why-col ul{list-style:none; padding:0; margin:0;}
        .why-col li{display:flex; gap:12px; align-items:flex-start; font-size:0.9rem; line-height:1.55; padding:9px 0; border-top:1px solid rgba(212,175,55,0.10);}
        .why-col li:first-child{border-top:none;}
        .why-col.no li{color: rgba(255,214,222,0.72);}
        .why-col.yes li{color: rgba(207,246,232,0.78);}
        .why-col li .bullet{width:18px; height:18px; border-radius:50%; flex-shrink:0; margin-top:2px; display:flex; align-items:center; justify-content:center; font-size:0.65rem; font-weight:700; border:1px solid rgba(212,175,55,0.28);}
        .why-col.no .bullet{background: rgba(120,20,50,0.22); color:#FF8FA3;}
        .why-col.yes .bullet{background: rgba(212,175,55,0.14); color: var(--gold);}

        .letter{background: var(--ink); position:relative; overflow:hidden; padding:64px 0; border-top:1px solid var(--gold); border-bottom:1px solid rgba(212,175,55,0.22);}
        .letter::before{content:""; position:absolute; inset:0; background: radial-gradient(800px 500px at 50% -10%, rgba(212,175,55,0.18), transparent 60%), radial-gradient(600px 400px at 85% 80%, rgba(76,29,149,0.35), transparent 60%); pointer-events:none;}
        .letter .wrap{display:flex; justify-content:space-between; align-items:center; gap:36px; flex-wrap:wrap;}
        .letter h2{font-size:clamp(1.6rem, 2.8vw, 2.1rem); color:#FFFBF2; max-width:18ch; line-height:0.98;}
        .letter p{color: var(--champagne-dim); font-size:0.92rem; margin-top:10px; max-width:36ch; line-height:1.6;}
        .letter form{display:flex; gap:10px; flex-shrink:0; flex-wrap:wrap; align-items:center;}
        .letter input{padding:15px 20px; border:1px solid rgba(212,175,55,0.26); border-radius:999px; background:#FFFBF2; color: var(--ink); font-family:'Space Grotesk', sans-serif; font-size:0.92rem; width:260px;}
        .letter button{padding:15px 26px; background: linear-gradient(135deg, #F1E4C7, #D4AF37); border:1px solid var(--gold); border-radius:999px; color: var(--ink); font-family:'Space Grotesk', sans-serif; font-weight:700; font-size:0.92rem; cursor:pointer; transition: all .2s ease;}
        .letter button:hover{transform:translateY(-1px);}
        .letter .success{background: rgba(212,175,55,0.12); border:1px solid rgba(212,175,55,0.32); color: var(--champagne); padding:12px 20px; border-radius:999px; font-weight:600; font-size:0.92rem; display:inline-flex; align-items:center; gap:10px; font-family:'Space Grotesk', sans-serif;}

        /* FOOTER PRO */
        .footer-pro{
          background: #0A0614;
          position:relative;
          overflow:hidden;
          border-top:2px solid var(--gold);
          color: var(--champagne-dim);
          padding:0;
        }
        .footer-pro::before{
          content:""; position:absolute; top:0; left:0; right:0; height:1px;
          background: linear-gradient(90deg, transparent, var(--gold), transparent);
          opacity:0.9;
        }
        .footer-pro::after{
          content:""; position:absolute; inset:0;
          background:
            radial-gradient(700px 400px at 15% 0%, rgba(212,175,55,0.08), transparent 60%),
            radial-gradient(600px 400px at 90% 10%, rgba(76,29,149,0.22), transparent 60%);
          pointer-events:none;
        }
        .footer-grid{
          display:grid;
          grid-template-columns:1.2fr 0.9fr 0.9fr 1.1fr;
          gap:36px;
          padding:56px 0 40px;
          position:relative; z-index:1;
        }
        .footer-col h4{
          font-family:'Space Grotesk', sans-serif;
          font-size:0.72rem; font-weight:700; letter-spacing:0.14em; text-transform:uppercase;
          color: var(--gold);
          margin-bottom:18px;
        }
        .footer-brand-tag{
          font-size:0.90rem; line-height:1.6; color: var(--champagne-dim); margin-top:16px; max-width:30ch;
        }
        .social-row{display:flex; gap:10px; margin-top:18px;}
        .social-icon{
          width:36px; height:36px; border-radius:999px;
          background: rgba(255,255,255,0.04);
          border:1px solid rgba(212,175,55,0.28);
          display:flex; align-items:center; justify-content:center;
          color: var(--gold);
          transition: all .2s ease;
        }
        .social-icon:hover{background: var(--gold); color: var(--ink); border-color: var(--gold); transform: translateY(-1px);}
        .footer-links{list-style:none; padding:0; margin:0;}
        .footer-links li{margin-bottom:10px;}
        .footer-links a{
          font-size:0.88rem; color: var(--champagne);
          transition: color .2s ease;
          line-height:1.45;
        }
        .footer-links a:hover{color: var(--gold);}
        .contact-item{
          display:flex; gap:10px; align-items:flex-start;
          margin-bottom:12px; font-size:0.88rem; color: var(--champagne);
        }
        .contact-item .ci{
          width:28px; height:28px; border-radius:50%;
          background: rgba(212,175,55,0.12);
          border:1px solid rgba(212,175,55,0.22);
          display:flex; align-items:center; justify-content:center;
          flex-shrink:0; color: var(--gold); font-size:0.82rem;
        }
        .contact-item a{color: var(--champagne); text-decoration:underline; text-underline-offset:3px; text-decoration-color: rgba(212,175,55,0.35);}
        .contact-item a:hover{color: var(--gold);}
        .footer-mini-form{display:flex; gap:8px; margin-top:16px;}
        .footer-mini-form input{
          flex:1; padding:12px 16px; border-radius:999px;
          border:1px solid rgba(212,175,55,0.26);

          color:#FFFBF2; font-family:'Space Grotesk', sans-serif; font-size:0.85rem;
        }
        .footer-mini-form input::placeholder{color: rgba(241,228,199,0.45);}
        .footer-mini-form button{
          width:40px; height:40px; border-radius:999px;
          background: linear-gradient(135deg, #F1E4C7, #D4AF37);

          color: var(--ink); font-weight:700; cursor:pointer;
          display:flex; align-items:center; justify-content:center;
        }
        .footer-bottom{
          border-top:1px solid rgba(212,175,55,0.14);
          padding:22px 0 28px;
          position:relative; z-index:1;
        }
        .footer-bottom-row{
          display:flex; justify-content:space-between; align-items:center; gap:16px; flex-wrap:wrap;
          font-family:'Space Grotesk', sans-serif; font-size:0.76rem; color: rgba(241,228,199,0.55);
        }
        .footer-bottom-links{display:flex; gap:14px; flex-wrap:wrap;}
        .footer-bottom-links a{color: rgba(241,228,199,0.7); text-decoration:underline; text-underline-offset:3px; text-decoration-color: rgba(212,175,55,0.28);}
        .footer-bottom-links a:hover{color: var(--gold);}
        .disclosure-grid{display:grid; grid-template-columns:1fr 320px; gap:18px; margin-top:20px; position:relative; z-index:1;}
        .disclosure-box{
          background: rgba(241,228,199,0.05);
          border:1px solid rgba(212,175,55,0.22);
          border-radius:16px; padding:16px 18px;
          color: var(--champagne-dim); line-height:1.6; font-size:0.80rem;
        }
        .disclosure-box strong{color: var(--champagne); font-weight:600;}
        .disclosure-box.small{font-size:0.76rem; background: rgba(255,80,80,0.06); border-color: rgba(255,80,80,0.18);}
        .disclosure-box.small strong{color:#FFB4B4;}

        .toast{
          position:fixed; bottom:24px; left:50%; transform:translateX(-50%);
          background: rgba(15,10,30,0.96);
          border:1px solid rgba(212,175,55,0.35);
          color: var(--champagne);
          padding:12px 20px; border-radius:999px;
          font-family:'Space Grotesk', sans-serif; font-size:0.86rem; font-weight:600;
          box-shadow:0 12px 30px -10px rgba(0,0,0,0.6);
          z-index:200;
          display:flex; align-items:center; gap:8px;
        }
        .toast .g{color: var(--gold);}

        /* FAQ Royal Premium */
        #faq{
          background: var(--ink);
          position:relative;
          overflow:hidden;
          padding:72px 0 80px;
          border-top:1px solid var(--gold);
          border-bottom:1px solid rgba(212,175,55,0.22);
        }
        #faq::before{
          content:""; position:absolute; inset:0;
          background:
            radial-gradient(800px 500px at 18% 0%, rgba(212,175,55,0.10), transparent 60%),
            radial-gradient(700px 500px at 85% 20%, rgba(76,29,149,0.32), transparent 65%),
            radial-gradient(600px 400px at 50% 100%, rgba(212,175,55,0.06), transparent 60%);
          pointer-events:none;
        }
        #faq .section-head{border-bottom-color: rgba(212,175,55,0.22); margin-bottom:8px;}
        #faq .section-head h2{color:#FFFBF2; max-width:18ch; line-height:0.98;}
        .faq-toggle-wrap{display:flex; justify-content:center; margin:36px 0 0; position:relative; z-index:1;}
        .faq-main-btn{
          display:inline-flex; align-items:center; justify-content:center; gap:10px;
          padding:15px 30px; border-radius:999px;
          font-family:'Space Grotesk', sans-serif; font-weight:700; font-size:0.92rem; letter-spacing:0.01em;
          border:1.5px solid var(--gold);
          background: linear-gradient(135deg, #F1E4C7 0%, #D4AF37 55%, #C6A22E 100%);
          color: var(--ink);
          cursor:pointer;
          box-shadow: 0 0 0 1px rgba(212,175,55,0.45) inset, 0 12px 30px -12px rgba(212,175,55,0.7), 0 1px 0 rgba(255,255,255,0.5) inset;
          transition: all .24s ease;
          white-space:nowrap;
        }
        .faq-main-btn:hover{transform:translateY(-2px); box-shadow:0 16px 36px -12px rgba(212,175,55,0.8), 0 0 0 1px rgba(212,175,55,0.55) inset;}
        .faq-main-btn.outline{
          background: rgba(255,255,255,0.03);
          color: var(--champagne);
          border-color: rgba(212,175,55,0.38);
          box-shadow: none;
        }
        .faq-main-btn.outline:hover{
          background: rgba(212,175,55,0.10);
          color: var(--gold);
          border-color: var(--gold);
        }
        .faq-container{
          max-height:0;
          overflow:hidden;
          opacity:0;
          transform: translateY(-8px);
          transition: max-height 0.62s cubic-bezier(0.4,0,0.2,1), opacity 0.42s ease, transform 0.42s ease, margin-top 0.4s ease;
          margin-top:0;
          position:relative; z-index:1;
        }
        .faq-container.open{
          max-height:6000px;
          opacity:1;
          transform: translateY(0);
          margin-top:36px;
        }
        .faq-list{
          display:flex; flex-direction:column; gap:12px;
          max-width:860px; margin:0 auto;
        }
        .faq-item{
          background: linear-gradient(180deg, rgba(255,255,255,0.06), rgba(255,255,255,0.02));
          border:1px solid rgba(212,175,55,0.18);
          border-radius:18px;
          overflow:hidden;
          transition: border-color .22s ease, transform .22s ease, background .22s ease;
          position:relative;
        }
        .faq-item::before{
          content:""; position:absolute; inset:0; border-radius:inherit;
          box-shadow: inset 0 1px 0 rgba(255,255,255,0.06), inset 0 0 0 1px rgba(212,175,55,0.06);
          pointer-events:none;
        }
        .faq-item:hover{border-color: rgba(212,175,55,0.30); transform: translateY(-1px);}
        .faq-item.active{
          border-color: rgba(212,175,55,0.38);
          background: linear-gradient(180deg, rgba(255,255,255,0.08), rgba(255,255,255,0.03));
          box-shadow: 0 16px 40px -20px rgba(0,0,0,0.55);
        }
        .faq-question{
          width:100%;
          display:flex; align-items:center; gap:14px;
          padding:20px 22px;
          background: transparent;
          border:none;
          cursor:pointer;
          text-align:left;
          position:relative;
        }
        .faq-num{
          width:36px; height:36px; border-radius:50%; flex-shrink:0;
          display:flex; align-items:center; justify-content:center;
          font-family:'Fraunces', serif; font-weight:700; font-size:0.82rem;
          background: radial-gradient(100% 100% at 30% 25%, #FFF8DF 0%, #F1E4C7 18%, #D4AF37 62%, #B8941F 100%);
          color: var(--ink); border:1px solid #C9A53A;
          box-shadow:0 3px 10px rgba(184,148,31,0.28), inset 0 1px 0 rgba(255,255,255,0.8);
        }
        .faq-qtext{
          font-family:'Space Grotesk', sans-serif;
          font-weight:600; font-size:0.96rem;
          color:#FFFBF2; line-height:1.35; flex:1;
          transition: color .20s ease;
        }
        .faq-item:hover .faq-qtext{color: var(--gold);}
        .faq-chevron{
          width:28px; height:28px; border-radius:50%;
          border:1px solid rgba(212,175,55,0.24);
          background: rgba(212,175,55,0.08);
          display:flex; align-items:center; justify-content:center;
          color: var(--gold); font-size:1rem; line-height:1;
          transition: transform .28s ease, background .22s ease, border-color .22s ease;
          flex-shrink:0;
        }
        .faq-item.active .faq-chevron{transform: rotate(180deg); background: rgba(212,175,55,0.16); border-color: rgba(212,175,55,0.36);}
        .faq-answer-wrap{
          display:grid; grid-template-rows:0fr;
          transition: grid-template-rows 0.42s cubic-bezier(0.4,0,0.2,1);
        }
        .faq-item.active .faq-answer-wrap{grid-template-rows:1fr;}
        .faq-answer-inner{overflow:hidden;}
        .faq-answer{
          padding:0 22px 0 72px;
          font-size:0.92rem; line-height:1.68;
          color:#C9B896;
          border-left:2px solid transparent;
          margin-left:22px;
          transition: border-color .28s ease, padding .28s ease;
        }
        .faq-item.active .faq-answer{
          border-left-color: var(--gold);
          padding-bottom:22px; padding-top:4px;
        }
        .faq-divider{
          height:1px; background: linear-gradient(90deg, rgba(212,175,55,0.22), transparent);
          margin:0 22px 0 94px;
          opacity:0; transition: opacity .28s ease;
        }
        .faq-item.active .faq-divider{opacity:1; margin-bottom:10px;}

        @media (max-width:1020px){
          .header-center{display:none;}
          .hamburger{display:flex;}
          .footer-grid{grid-template-columns:1fr 1fr; gap:28px;}
          .disclosure-grid{grid-template-columns:1fr;}
        }
        @media (max-width:860px){
          .wrap{padding:0 20px;}
          .mobile-panel{padding-left:20px; padding-right:20px;}
          .hero{grid-template-columns:1fr; padding:52px 0 42px; gap:32px;}
          .guides{grid-template-columns:1fr;}
          .why{grid-template-columns:1fr;}
          .listing{grid-template-columns:40px 1fr; row-gap:10px; padding:18px 18px 18px 16px;}
          .listing .price, .listing .go{grid-column:2; text-align:left; justify-self:start;}
          .letter .wrap{justify-content:flex-start;}
          .letter input{width:100%; min-width:0; flex:1 1 100%;}

          .watermark{font-size:5rem; top:6px;}
          .country-stats{grid-template-columns:1fr 1fr;}
          .faq-answer{padding-left:22px; margin-left:0; border-left-width:2px;}
          .faq-divider{margin-left:22px;}
